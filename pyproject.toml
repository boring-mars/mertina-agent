[project]
name = "mertina-agent"
description = "A tool-using AI agent harness, cut down from Hermes Agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSES/Hermes-Agent-MIT.txt"]
authors = [{ name = "Mertina Agent contributors" }]
keywords = ["agent", "llm", "openai", "assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/boring-mars/mertina-agent"
Repository = "https://github.com/boring-mars/mertina-agent"
Issues = "https://github.com/boring-mars/mertina-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth for the version: the package itself.
path = "src/mertina_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mertina_agent"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "F",    # pyflakes
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # isort
  "N",    # pep8-naming
  "D",    # pydocstyle
  "UP",   # pyupgrade — modern syntax (list[str], X | None)
  "ANN",  # flake8-annotations — public functions are typed
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "EM",   # flake8-errmsg
  "G",    # flake8-logging-format — lazy log formatting
  "LOG",  # flake8-logging
  "PTH",  # flake8-use-pathlib — no os.path string joining
  "RET",  # flake8-return
  "SIM",  # flake8-simplify
  "T20",  # flake8-print — no print() in library code
  "TID",  # flake8-tidy-imports
  "ARG",  # flake8-unused-arguments
  "PT",   # flake8-pytest-style
  "RUF",  # ruff-specific rules
]
ignore = [
  "D203",  # conflicts with D211 (no blank line before class docstring)
  "D213",  # conflicts with D212 (summary on the first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names, and their signatures are fixtures.
"tests/**/*.py" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
extra_checks = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
markers = [
  "integration: talks to real external services; deselect with -m 'not integration'",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/mertina_agent"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
