name: Bug report
description: Report something that doesn't work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. You can write in English or Chinese.

        **Do not report security vulnerabilities here.** Use the private
        [security advisory form](https://github.com/boring-mars/mertina-agent/security/advisories/new) instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or code that shows the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Mertina Agent version
      description: Release version, or commit SHA if running from source.
      placeholder: "0.1.0 or a1b2c3d"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Local (uv run)
        - Docker / Docker Compose
        - Cloud deployment
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, cloud provider, and anything else relevant.
      placeholder: "Python 3.12, Ubuntu 24.04, AWS"

  - type: textarea
    id: logs
    attributes:
      label: Logs and error messages
      description: |
        Paste relevant logs as text. They will be formatted as code automatically.
        **Remove API keys, tokens, passwords and personal data before posting.**
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help, including what you already tried.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues (including closed ones) and this is not a duplicate.
          required: true
        - label: I removed secrets and personal data from everything above.
          required: true
