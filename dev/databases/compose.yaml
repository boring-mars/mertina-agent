name: mertina-agent-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mertina_dev
      POSTGRES_USER: mertina
      POSTGRES_PASSWORD: mertina_local_dev
    ports:
      - "127.0.0.1:${MERTINA_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mertina -d mertina_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    environment:
      MYSQL_DATABASE: mertina_dev
      MYSQL_USER: mertina
      MYSQL_PASSWORD: mertina_local_dev
      MYSQL_ROOT_PASSWORD: mertina_root_local_dev
    ports:
      - "127.0.0.1:${MERTINA_DEV_MYSQL_PORT:-53306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"'
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
  mysql-data:
