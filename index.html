<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mertina Web UI v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three zones — session rail | conversation | run inspector (overlay below 1180px) */
:root {
  --canvas: #FAF9F6; --sidebar: #F3F1EC; --surface: #FFFFFF; --subtle: #F2EFE9; --hover: #EAE6DD;
  --border: #E5E0D8; --border-strong: #D5CEC3;
  --text: #1F1D1A; --muted: #66615A; --faint: #8C857B;
  --accent: #C96442; --accent-hover: #B55434; --accent-soft: rgba(201,100,66,.11); --accent-fg: #FFFFFF;
  --bubble: #EFECE5; --code: #F4F1EA; --code-head: #EBE7DE;
  --ok: #2D7A57; --ok-soft: rgba(45,122,87,.12);
  --warn: #B4690E; --warn-soft: rgba(180,105,14,.12);
  --err: #C43D3D; --err-soft: rgba(196,61,61,.11);
  --shadow: 0 2px 12px rgba(31,29,26,.07); --shadow-lg: 0 12px 40px rgba(31,29,26,.16);
  --scrim: rgba(31,29,26,.28);
  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #1C1B18; --sidebar: #161513; --surface: #24221F; --subtle: #2A2824; --hover: #312E29;
  --border: #33302B; --border-strong: #46413A;
  --text: #ECE9E2; --muted: #A49E94; --faint: #7B756D;
  --accent: #D97757; --accent-hover: #E38668; --accent-soft: rgba(217,119,87,.16); --accent-fg: #181412;
  --bubble: #2A2824; --code: #171614; --code-head: #22201D;
  --ok: #4CA87B; --ok-soft: rgba(76,168,123,.16);
  --warn: #E09F3E; --warn-soft: rgba(224,159,62,.16);
  --err: #E06C6C; --err-soft: rgba(224,108,108,.15);
  --shadow: 0 4px 20px rgba(0,0,0,.35); --shadow-lg: 0 16px 48px rgba(0,0,0,.55);
  --scrim: rgba(0,0,0,.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #1C1B18; --sidebar: #161513; --surface: #24221F; --subtle: #2A2824; --hover: #312E29;
  --border: #33302B; --border-strong: #46413A;
  --text: #ECE9E2; --muted: #A49E94; --faint: #7B756D;
  --accent: #D97757; --accent-hover: #E38668; --accent-soft: rgba(217,119,87,.16); --accent-fg: #181412;
  --bubble: #2A2824; --code: #171614; --code-head: #22201D;
  --ok: #4CA87B; --ok-soft: rgba(76,168,123,.16);
  --warn: #E09F3E; --warn-soft: rgba(224,159,62,.16);
  --err: #E06C6C; --err-soft: rgba(224,108,108,.15);
  --shadow: 0 4px 20px rgba(0,0,0,.35); --shadow-lg: 0 16px 48px rgba(0,0,0,.55);
  --scrim: rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--canvas); color: var(--text); font-family: var(--font-ui); font-size: 14px; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
svg { flex-shrink: 0; }

.app { height: 100%; display: flex; position: relative; overflow: hidden; }

/* ---------- Sidebar ---------- */
.sidebar { width: 264px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); transition: margin-left .2s ease, transform .2s ease; }
.app[data-sidebar="closed"] .sidebar { margin-left: -264px; }
.brand { height: 52px; padding: 0 10px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand-mark { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; letter-spacing: -.01em; }
.logo { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--subtle); color: var(--muted); font-weight: 500; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.side-actions { padding: 0 10px 10px; display: grid; gap: 6px; }
.new-chat { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 500; box-shadow: var(--shadow); }
.new-chat:hover { border-color: var(--border-strong); }
.search-btn { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; color: var(--faint); border: 1px solid var(--border); }
.search-btn:hover { background: var(--hover); color: var(--muted); }
.kbd { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; line-height: 16px; }
.session-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; display: flex; flex-direction: column; gap: 14px; }
.group-label { padding: 4px 8px; font-size: 11.5px; color: var(--faint); font-weight: 500; letter-spacing: .02em; }
.group { display: flex; flex-direction: column; gap: 1px; }
.s-item { position: relative; display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; border-radius: 9px; cursor: pointer; text-align: left; width: 100%; }
.s-item:hover { background: var(--hover); }
.s-item[aria-current="true"] { background: var(--hover); }
.s-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.s-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.s-item[aria-current="true"] .s-title { color: var(--text); font-weight: 500; }
.s-sub { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-sub.running { color: var(--accent); }
.s-sub.unread { color: var(--text); font-weight: 500; }
.s-ind { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.s-ind.running { background: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
.s-ind.unread { background: var(--accent); }
.s-ind.none { background: transparent; }
.s-tools { display: none; gap: 2px; }
.s-item:hover .s-tools, .s-item:focus-within .s-tools { display: flex; }
.s-tools .icon-btn { width: 24px; height: 24px; border-radius: 6px; }
.s-tools .icon-btn:hover { background: var(--border); }
.s-rename { width: 100%; font-size: 13px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--accent); background: var(--surface); outline: none; }
.side-foot { border-top: 1px solid var(--border); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; font-size: 12px; }
.conn-row { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.foot-meta { color: var(--faint); display: flex; justify-content: space-between; font-size: 11.5px; }

/* ---------- Main ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--canvas); }
.topbar { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.title-wrap { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.title-btn { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 3px 6px; border-radius: 6px; max-width: 100%; text-align: left; }
.title-btn:hover { background: var(--hover); }
.title-input { font-size: 14px; font-weight: 600; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--accent); background: var(--surface); outline: none; min-width: 0; width: min(420px, 100%); }
.title-meta { font-size: 12px; color: var(--faint); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip button { text-decoration: underline; text-underline-offset: 2px; }
.ghost-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--border); }
.ghost-btn:hover { background: var(--hover); color: var(--text); }
.ghost-btn[aria-pressed="true"] { background: var(--hover); color: var(--text); }

.chat-scroll { flex: 1; overflow-y: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); scroll-behavior: auto; }
.chat { max-width: 760px; margin: 0 auto; padding-block: 28px 24px; display: flex; flex-direction: column; gap: 28px; }
.u-row { display: flex; justify-content: flex-end; }
.u-bubble { max-width: 85%; background: var(--bubble); border-radius: 18px; padding: 10px 16px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.u-queued { opacity: .65; border: 1px dashed var(--border-strong); background: transparent; }
.queued-meta { font-size: 11.5px; color: var(--faint); text-align: right; margin-top: 4px; display: flex; gap: 10px; justify-content: flex-end; }
.queued-meta button { color: var(--accent); }
.a-row { display: flex; gap: 14px; align-items: flex-start; }
.a-avatar { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-top: 1px; flex-shrink: 0; }
.a-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

/* run progress strip */
.phases { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 12px; color: var(--faint); }
.ph { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; }
.ph.done { color: var(--muted); }
.ph.now { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.ph.now.warn { background: var(--warn-soft); color: var(--warn); }
.ph-sep { color: var(--border-strong); }
.ph .pdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
.elapsed { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); }

/* tools */
.tools { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
.tools-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--muted); text-align: left; }
.tools-head:hover { background: var(--subtle); }
.tools-head .chev { margin-left: auto; transition: transform .15s; }
.tools[data-open="true"] .chev { transform: rotate(180deg); }
.tool-rows { border-top: 1px solid var(--border); }
.tool-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; font-size: 12.5px; }
.tool-row + .tool-row { border-top: 1px solid var(--border); }
.t-name { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--subtle); color: var(--muted); }
.t-name.running { background: var(--accent-soft); color: var(--accent); }
.t-name.ok { background: var(--ok-soft); color: var(--ok); }
.t-name.error { background: var(--err-soft); color: var(--err); }
.t-desc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.t-desc .mono { color: var(--faint); font-size: 11.5px; }
.t-right { display: flex; align-items: center; gap: 10px; color: var(--faint); font-family: var(--font-mono); font-size: 11.5px; }
.link { color: var(--accent); font-family: var(--font-ui); font-size: 12px; }
.link:hover { text-decoration: underline; }

/* notices */
.notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 12.5px; line-height: 1.55; border: 1px solid transparent; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.err { background: var(--err-soft); color: var(--err); }
.notice.accent { background: var(--accent-soft); color: var(--accent); }
.notice .n-main { flex: 1; min-width: 0; }
.notice .n-main b { font-weight: 600; }
.notice .n-sub { color: var(--muted); margin-top: 2px; }
.notice .n-act { display: flex; gap: 6px; flex-shrink: 0; }
.pill-btn { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 500; border: 1px solid currentColor; white-space: nowrap; }
.pill-btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.ring { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

/* prose */
.prose { line-height: 1.72; word-break: break-word; }
.prose > * + * { margin-top: .8em; }
.prose p { margin: 0; }
.prose h3 { font-size: 15px; font-weight: 600; margin: 1.3em 0 .4em; text-wrap: balance; }
.prose ul, .prose ol { margin: 0; padding-left: 1.35em; }
.prose li + li { margin-top: .25em; }
.prose code.ic { font-family: var(--font-mono); font-size: .86em; background: var(--subtle); border: 1px solid var(--border); padding: .05em .35em; border-radius: 5px; }
.prose .tbl { overflow-x: auto; }
.prose table { border-collapse: collapse; font-size: 13px; width: 100%; }
.prose th, .prose td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; vertical-align: top; }
.prose th { background: var(--subtle); font-weight: 600; }
.code { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--code); }
.code-head { display: flex; justify-content: space-between; padding: 6px 12px; background: var(--code-head); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; }
.stale { opacity: .38; text-decoration: line-through; text-decoration-color: var(--faint); transition: opacity .3s; }
.caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 2px; vertical-align: -.18em; background: var(--accent); animation: blink .9s steps(1) infinite; }
.thinking { color: var(--faint); font-size: 13.5px; }
.trunc { font-size: 12px; color: var(--warn); display: flex; align-items: center; gap: 6px; }

.a-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--faint); }
.a-foot button:hover { color: var(--text); text-decoration: underline; }
.saved { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); }
.stop-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }

/* empty */
.empty { padding: 64px 0 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px; }
.empty-logo { width: 46px; height: 46px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.empty h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.empty p { margin: 6px 0 0; color: var(--muted); max-width: 420px; line-height: 1.6; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; width: 100%; text-align: left; }
.starter { padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); display: grid; gap: 4px; }
.starter:hover { border-color: var(--border-strong); background: var(--subtle); }
.starter b { font-size: 13px; font-weight: 500; }
.starter span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* jump pill */
.jump { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(132px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow); font-size: 12.5px; font-weight: 500; }
.jump .dot { background: var(--accent); }

/* composer */
.dock { flex-shrink: 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.composer { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 18px; box-shadow: var(--shadow); transition: border-color .15s; }
.composer:focus-within { border-color: var(--accent); }
.composer[data-disabled="true"] { opacity: .8; }
.composer textarea { display: block; width: 100%; resize: none; border: 0; outline: none; background: transparent; padding: 14px 16px 6px; line-height: 1.6; max-height: 200px; min-height: 48px; }
.composer textarea::placeholder { color: var(--faint); }
.c-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 10px 10px 12px; }
.c-left { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; color: var(--faint); }
.c-tool { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; background: var(--subtle); color: var(--muted); }
.c-right { display: flex; align-items: center; gap: 10px; }
.c-hint { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.send { height: 34px; min-width: 34px; padding: 0 12px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 500; background: var(--accent); color: var(--accent-fg); }
.send:hover:not(:disabled) { background: var(--accent-hover); }
.send.stop { background: var(--text); color: var(--canvas); }
.send.stopping { background: var(--hover); color: var(--muted); }

/* ---------- Inspector ---------- */
.inspector { width: 340px; flex-shrink: 0; background: var(--sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding-right: env(safe-area-inset-right, 0px); }
.app[data-inspector="closed"] .inspector { display: none; }
.insp-head { height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 8px 0 10px; border-bottom: 1px solid var(--border); }
.tabs { display: flex; gap: 2px; }
.tab { height: 28px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { background: var(--hover); color: var(--text); }
.insp-body { flex: 1; overflow-y: auto; padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; font-size: 12.5px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.card h4 { margin: 0; font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; }
.kv dt { color: var(--faint); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 11.5px; text-align: right; word-break: break-all; }
.sec-label { font-size: 11.5px; color: var(--faint); font-weight: 500; letter-spacing: .02em; padding: 0 2px; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 54px 12px 1fr; gap: 8px; align-items: start; font-size: 12px; }
.tl-t { font-family: var(--font-mono); font-size: 11px; color: var(--faint); text-align: right; padding-top: 1px; }
.tl-mark { position: relative; height: 100%; min-height: 24px; }
.tl-mark::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 1px; background: var(--border-strong); }
.tl:last-child .tl-mark::before { bottom: auto; height: 8px; }
.tl-mark::after { content: ""; position: absolute; left: 2px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.tl.accent .tl-mark::after { background: var(--accent); }
.tl.ok .tl-mark::after { background: var(--ok); }
.tl.warn .tl-mark::after { background: var(--warn); }
.tl.err .tl-mark::after { background: var(--err); }
.tl-txt { padding-bottom: 8px; color: var(--muted); }
.tl-txt .mono { color: var(--faint); font-size: 11px; }
pre.json { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--subtle); font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-all; }
.src { padding: 10px 0; border-top: 1px solid var(--border); display: grid; gap: 3px; }
.src:first-of-type { border-top: 0; padding-top: 0; }

      const p = []; while (i < L.length && L[i].trim() && !L[i].startsWith('### ') && !L[i].trim().startsWith('```') && !/^\s*-\s+/.test(L[i]) && !/^\s*\d+\.\s+/.test(L[i])) p.push(inline(L[i++]));
      out.push(`<p>${p.join('<br>')}</p>`);
    }
    return out.join('');
  }

  // ---------------------------------------------------------------- formatting
  const fmtS = (ms) => (ms / 1000).toFixed(1) + 's';
  const fmtClock = (ms) => '+' + (ms / 1000).toFixed(2);
  const PHASES = [
    { key: 'queued', label: '排队' }, { key: 'thinking', label: '思考' }, { key: 'tools', label: '工具' },
    { key: 'writing', label: '生成' }, { key: 'saving', label: '保存' },
  ];
  const PHASE_TEXT = { queued: '排队中', thinking: '思考中', tools: '调用工具中', writing: '生成中', saving: '保存中', retrying: '等待重试', stopping: '正在停止' };
  const ERROR_TEXT = {
    model_failed: ['模型调用失败', '已用尽重试次数。你的消息和这一轮的结果已保存在会话里，可以直接重新发送。'],
    shutdown_cancelled: ['Gateway 关闭时中断了本轮', '本轮在 Gateway 退出时被取消。'],
  };

  // ---------------------------------------------------------------- rendering: sidebar
  function renderSidebar() {
    if (state.renamingSidebar && document.activeElement?.dataset?.rename === state.renamingSidebar) return;
    const list = $('session-list');
    const groups = {};
    state.sessions.filter((s) => s.id !== state.pendingDelete?.id).forEach((s) => (groups[s.group] ||= []).push(s));
    let html = '';
    for (const [g, items] of Object.entries(groups)) {
      html += `<div class="group"><div class="group-label">${esc(g)}</div>`;
      for (const s of items) {
        if (state.renamingSidebar === s.id) {
          html += `<div style="padding:3px 4px"><input class="s-rename" id="rename-${s.id}" data-rename="${s.id}" value="${esc(s.title)}" aria-label="会话标题"></div>`;
          continue;
        }
        const run = runOfSession(s);
        const m = run && findMsg(run.msgId)[1];
        let ind = 'none', sub = esc(s.updated), subCls = '';
        if (m) { ind = 'running'; subCls = 'running'; sub = m.stopRequested ? '正在停止…' : PHASE_TEXT[m.phase] + '…'; }
        else if (s.unread) { ind = 'unread'; subCls = 'unread'; sub = '有新回复'; }
        const running = Boolean(s.active_run_id);
        html += `<div class="s-item" role="button" tabindex="0" data-open="${s.id}" aria-current="${s.id === state.activeId}">
          <span class="s-ind ${ind}"></span>
          <span class="s-main"><span class="s-title">${esc(s.title)}</span><span class="s-sub ${subCls}">${sub}</span></span>
          <span class="s-tools">
            <button class="icon-btn" data-rename-start="${s.id}" title="重命名" aria-label="重命名">${ICON.pen}</button>
            <button class="icon-btn" data-del="${s.id}" ${running ? 'disabled' : ''} title="${running ? '运行中的会话不能删除，请先停止' : '删除'}" aria-label="删除">${ICON.trash}</button>
          </span>
        </div>`;
      }
      html += '</div>';
    }
    list.innerHTML = html;
    if (state.renamingSidebar) {
      const inp = $('rename-' + state.renamingSidebar);
      if (inp) { inp.focus(); inp.select(); bindRename(inp, state.renamingSidebar, () => { state.renamingSidebar = null; renderSidebar(); }); }
    }
  }

  function renderConn() {
    const g = state.gateway;
    const color = g === 'online' ? 'var(--ok)' : 'var(--warn)';
    const label = g === 'online' ? '已连接' : g === 'connecting' ? '连接中…' : '未连接';
    $('conn-row').innerHTML = `<span class="dot" style="background:${color}"></span><span class="mono" style="font-size:11.5px">127.0.0.1:8765</span><span style="margin-left:auto;color:${color}">${label}</span>`;
    const chip = $('conn-chip');
    if (g === 'online') chip.innerHTML = '';
    else if (g === 'connecting') chip.innerHTML = `<span class="chip warn">${ICON.sync}正在连接 Gateway…</span>`;
    else chip.innerHTML = `<span class="chip warn">${ICON.warn}<span class="hide-sm">Gateway 未连接</span><button id="btn-reconnect">重试</button></span>`;
  }

  // ---------------------------------------------------------------- rendering: header
  function renderHeader() {
    const s = active(); const wrap = $('title-wrap');
    if (!s) { wrap.innerHTML = ''; return; }
    if (state.renamingHeader && document.activeElement?.id === 'title-input') return;
    if (state.renamingHeader) {
      wrap.innerHTML = `<input class="title-input" id="title-input" value="${esc(s.title)}" aria-label="会话标题">`;
      const inp = $('title-input'); inp.focus(); inp.select();
      bindRename(inp, s.id, () => { state.renamingHeader = false; renderHeader(); });
      return;
    }
    const turns = s.messages.filter((m) => m.role === 'user').length;
    wrap.innerHTML = `<button class="title-btn" id="title-btn" title="点击重命名">${esc(s.title)}</button><span class="title-meta tnum">rev ${s.revision} · ${turns} 轮</span>`;
  }

  function bindRename(inp, sid, done) {
    let finished = false;
    const commit = (save) => {
      if (finished) return; finished = true;
      const s = sessionOf(sid); const v = inp.value.trim();
      if (save && s && v && v !== s.title) {
        const prev = s.title; s.title = v; s.metadata_version += 1;
        logEvent(null, 'PATCH /api/sessions/' + sid, { title: v, expected_metadata_version: s.metadata_version - 1 }, 'http');
        toast(`已重命名`, { action: '撤销', onAction: () => { s.title = prev; s.metadata_version += 1; renderAll(); } });
      }
      done(); renderSidebar(); renderHeader();
    };
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); commit(true); }
      if (e.key === 'Escape') { e.stopPropagation(); commit(false); }
    });
    inp.addEventListener('blur', () => commit(true));
  }

  // ---------------------------------------------------------------- rendering: chat
  function phaseStrip(m) {
    const order = PHASES.map((p) => p.key);
    const cur = m.phase === 'retrying' ? 'writing' : m.phase;
    const ci = order.indexOf(cur);
    const items = PHASES.filter((p) => p.key !== 'tools' || m.tools.length || cur === 'tools').map((p) => {
      const idx = order.indexOf(p.key);
      let cls = idx < ci ? 'done' : idx === ci ? 'now' : '';
      let label = p.label;
      if (p.key === 'tools' && m.tools.length) { const d = m.tools.filter((t) => t.status !== 'running').length; label = `工具 ${d}/${m.tools.length}`; }
      if (idx === ci && m.phase === 'retrying') { cls += ' warn'; label = '等待重试'; }
      if (idx === ci && m.stopRequested) { cls += ' warn'; label = '正在停止'; }
      return `<span class="ph ${cls}">${idx === ci ? '<span class="pdot"></span>' : idx < ci ? ICON.check : ''}${label}</span>`;
    });
    return `<div class="phases">${items.join('<span class="ph-sep">›</span>')}<span class="elapsed tnum" data-elapsed="${m.id}">${fmtS(now() - m.startedAt)}</span></div>`;
  }

  function toolsBlock(m) {
    if (!m.tools.length && !m.generatingTool) return '';
    const running = m.tools.filter((t) => t.status === 'running').length;
    const errors = m.tools.filter((t) => t.status === 'error').length;
    let head;
    if (m.generatingTool && !m.tools.length) head = `<span class="s-ind running"></span>模型正在准备调用 <span class="mono">${esc(m.generatingTool)}</span>…`;
    else if (running) head = `<span class="s-ind running"></span>正在并行调用 ${m.tools.length} 个工具 · 已完成 ${m.tools.length - running}`;
    else {
      const total = Math.max(...m.tools.map((t) => t.duration_s || 0));
      head = errors
        ? `<span style="color:var(--err)">${ICON.err}</span>调用了 ${m.tools.length} 个工具 · ${errors} 个出错`
        : `<span style="color:var(--ok)">${ICON.check}</span>调用了 ${m.tools.length} 个工具 · 最长 ${total.toFixed(1)}s`;
    }
    const rows = m.tools.map((t) => {
      const dur = t.status === 'running' ? `<span data-tool-elapsed="${t.call_id}" data-start="${t.start}">${fmtS(now() - t.start)}</span>` : `${t.duration_s.toFixed(2)}s`;
      const desc = t.args ? `“${esc(t.args.query)}”` : `<span class="mono">${esc(t.call_id)}</span>${t.status === 'error' ? ' · 工具返回错误，模型会据此调整' : ''}`;
      return `<div class="tool-row"><span class="t-name ${t.status}">${esc(t.name)}</span><span class="t-desc">${desc}</span><span class="t-right">${dur}${t.status !== 'running' ? `<button class="link" data-inspect="${m.id}">详情</button>` : ''}</span></div>`;
    }).join('');
    return `<div class="tools" data-open="${m.toolsOpen}"><button class="tools-head" data-toggle-tools="${m.id}" aria-expanded="${m.toolsOpen}">${head}${m.tools.length ? ICON.chev : ''}</button>${m.toolsOpen && m.tools.length ? `<div class="tool-rows">${rows}</div>` : ''}</div>`;
  }

  function retryRing(m) {
    const r = m.retry; const total = r.wait_s * 1000; const left = Math.max(0, r.until - now());
    const frac = total ? left / total : 0; const C = 2 * Math.PI * 6;
    return `<svg class="ring" viewBox="0 0 16 16" data-ring="${m.id}"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" transform="rotate(-90 8 8)"/></svg>`;
  }

  function notices(m) {
    let h = '';
    if (m.conn === 'reconnecting') h += `<div class="notice accent">${ICON.sync}<div class="n-main"><b>连接中断，正在重新订阅</b><div class="n-sub">后台运行不受影响，恢复后会从 Last-Event-ID ${m.lastEventId} 接着播放。</div></div></div>`;
    if (m.conn === 'resync') h += `<div class="notice accent">${ICON.sync}<div class="n-main"><b>正在同步</b><div class="n-sub">断开期间的事件已超出缓冲，正在拉取本轮快照。</div></div></div>`;
    if (m.retry) {
      const left = Math.max(0, (m.retry.until - now()) / 1000);
      h += `<div class="notice warn">${retryRing(m)}<div class="n-main"><b>第 ${m.retry.attempt} 次尝试失败（${esc(m.retry.reason)}）</b><div class="n-sub"><span data-retry-left="${m.id}" class="tnum">${left.toFixed(1)}</span>s 后进行第 ${m.retry.attempt + 1}/${m.retry.max_attempts} 次尝试。${m.staleText ? '上一版草稿会被新回答替换。' : ''}</div></div></div>`;
    }
    return h;
  }

  function footer(m) {
    if (!isTerminal(m)) return '';
    const dur = m.elapsedMs ? `<span class="tnum">用时 ${fmtS(m.elapsedMs)}</span>` : '';
    const saved = m.durable ? `<span class="saved">${ICON.check}已保存 · rev ${m.revision}</span>` : '';
    const details = `<button data-inspect="${m.id}">详情</button>`;
    if (m.status === 'completed') return `<div class="a-foot"><button data-copy="${m.id}">复制</button>${dur}${saved}${details}</div>`;
    if (m.status === 'stopped') {
      return `<div class="a-foot"><span class="stop-chip">已停止${m.durable ? ' · 已保存' : ''}</span>${m.text ? `<button data-continue="${m.id}">继续生成</button><button data-copy="${m.id}">复制</button>` : ''}${dur}${details}</div>`;
    }
    // failed
    if (m.reconciliation) {
      return `<div class="notice warn">${ICON.warn}<div class="n-main"><b>保存结果尚未确认</b><div class="n-sub">Gateway 在写入数据库时退出，这一轮可能已保存，也可能没有。重新读取会话即可确认，确认前请不要重发。</div></div><div class="n-act"><button class="pill-btn" data-reconcile="${m.id}">重新读取会话</button></div></div>`;
    }
    const [title, sub] = ERROR_TEXT[m.error] || ['本轮失败', '出现未知错误。'];
    return `<div class="notice err">${ICON.err}<div class="n-main"><b>${title}</b><div class="n-sub">${sub}${m.durable ? '' : ' 本轮没有写入会话。'}</div></div><div class="n-act"><button class="pill-btn" data-resend="${m.id}">重新发送</button></div></div><div class="a-foot">${dur}${saved}${details}</div>`;
  }

  function assistantHTML(m) {
    const live = !isTerminal(m);
    let body = '';
    if (m.text) body = `<div class="prose">${md(m.text)}${live ? '<span class="caret"></span>' : ''}</div>`;
    else if (m.staleText) body = `<div class="prose stale">${md(m.staleText)}</div>`;
    else if (live && !m.retry && !m.conn && m.phase !== 'tools') body = `<div class="thinking">${m.stopRequested ? '正在停止…' : m.phase === 'queued' ? '已提交，等待开始…' : m.phase === 'saving' ? '' : '思考中'}${m.phase === 'saving' ? '' : '<span class="caret"></span>'}</div>`;
    else if (!live && !m.text) body = `<div class="thinking">（没有生成正文）</div>`;
    const trunc = m.truncated ? `<div class="trunc">${ICON.warn}回答超过长度上限，已在此处截断。</div>` : '';
    return `<div class="a-row" data-mid="${m.id}">
      <div class="a-avatar">${ICON.hex}</div>
      <div class="a-body">${live ? phaseStrip(m) : ''}${notices(m)}${toolsBlock(m)}${body}${trunc}${footer(m)}</div>
    </div>`;
  }

  function emptyHTML() {
    return `<div class="empty">
      <div class="empty-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div>
      <div><h2>今天想研究什么？</h2><p>对话保存在本机数据库里。刷新或关掉标签页不会打断正在运行的回答，回来后会自动接上。</p></div>
      <div class="starters">
        <button class="starter" data-starter="normal" data-text="对比 Vite 6 和 Turbopack 最新的构建速度与生态进展"><b>联网调研</b><span>并行搜索后汇总成对照</span></button>
        <button class="starter" data-starter="normal" data-text="解释 SSE 断线后怎样用 Last-Event-ID 与 409 resync 做到不丢帧"><b>协议问答</b><span>结构化 Markdown、表格和代码</span></button>
        <button class="starter" data-starter="long" data-text="写一份本地优先 AI 助手的 3 个月迭代节奏建议"><b>长文起草</b><span>随时停止，保留草稿继续追问</span></button>
      </div>
    </div>`;
  }

  function renderChat(scroll) {
    const s = active(); const chat = $('chat');
    if (!s) { chat.innerHTML = ''; return; }
    if (!s.messages.length && !s.queued) { chat.innerHTML = emptyHTML(); }
    else {
      chat.innerHTML = s.messages.map((m) => m.role === 'user'
        ? `<div class="u-row"><div class="u-bubble">${esc(m.content)}</div></div>`
        : assistantHTML(m)).join('') + (s.queued ? `<div><div class="u-row"><div class="u-bubble u-queued">${esc(s.queued)}</div></div><div class="queued-meta"><span>本轮结束后自动发送</span><button data-unqueue>撤回到输入框</button></div></div>` : '');
    }
    if (scroll) toBottom();
    updateJump();
  }

  // targeted re-render of one message, batched per animation frame
  const dirty = new Set(); let rafPending = false;
  function touch(msgId) {
    dirty.add(msgId);
    if (rafPending) return; rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      const stick = atBottom();
      let full = false;
      for (const id of dirty) {
        const [s, m] = findMsg(id);
        if (!s || s.id !== state.activeId) continue;
        const el = document.querySelector(`[data-mid="${id}"]`);
        if (el) el.outerHTML = assistantHTML(m); else full = true;
      }
      dirty.clear();
      if (full) renderChat(false);
      if (stick) toBottom(); else if (followMsg()) state.hasNewBelow = true;
      updateJump();
      renderSidebar(); renderComposer(); renderHeader();
      if (state.inspectorOpen()) renderInspector();
    });
  }
  const followMsg = () => { const r = runOfSession(active() || {}); return Boolean(r); };

  // ---------------------------------------------------------------- scroll
  const scroller = $('chat-scroll');
  const atBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
  function toBottom() { scroller.scrollTop = scroller.scrollHeight; state.hasNewBelow = false; }
  function updateJump() {
    const j = $('jump'); const show = !atBottom();
    j.hidden = !show;
    if (show) j.innerHTML = state.hasNewBelow ? `<span class="dot"></span>有新内容 ${ICON.down}` : `回到底部 ${ICON.down}`;
  }
  scroller.addEventListener('scroll', () => { if (atBottom()) state.hasNewBelow = false; updateJump(); });
  $('jump').onclick = () => { scroller.scrollTo({ top: scroller.scrollHeight, behavior: 'smooth' }); state.hasNewBelow = false; };

  // ---------------------------------------------------------------- composer
  const input = $('input');
  function renderComposer() {
    const s = active(); if (!s) return;
    const run = runOfSession(s); const m = run && findMsg(run.msgId)[1];
    const send = $('send'); const hint = $('hint'); const comp = $('composer');
    const offline = state.gateway !== 'online';
    comp.dataset.disabled = offline;
    if (m && m.stopRequested) {
      send.className = 'send stopping'; send.disabled = true; send.innerHTML = '停止中…'; send.title = '';
      hint.textContent = '已生成的内容会被保存';
    } else if (m) {
      const hasText = input.value.trim().length > 0;
      if (hasText && !s.queued) {
        send.className = 'send'; send.disabled = false; send.innerHTML = '排队发送'; send.title = '本轮结束后自动发送';
        hint.textContent = 'Esc 停止本轮';
      } else {
        send.className = 'send stop'; send.disabled = false; send.innerHTML = `${ICON.stop}停止`; send.title = '停止 (Esc)';
        hint.textContent = s.queued ? '已有一条排队消息' : '可以先写下一条，本轮结束后发送';
      }
    } else {
      send.className = 'send'; send.innerHTML = ICON.send; send.title = '发送 (Enter)';
      send.disabled = offline || !input.value.trim();
      hint.textContent = offline ? '未连接 Gateway，草稿已保留' : 'Enter 发送 · Shift+Enter 换行';
    }
    input.placeholder = m ? '写下一条消息…' : '给 Mertina 发消息';
  }
  function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; }
  input.addEventListener('input', () => {
    autosize(); const s = active(); if (s) { s.draft = input.value; saveDrafts(); }
    renderComposer();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); primaryAction(); }
  });
  $('send').onclick = primaryAction;
  function saveDrafts() { const d = {}; state.sessions.forEach((s) => { if (s.draft) d[s.id] = s.draft; }); store.set('drafts', d); }
  function loadDraft() { const s = active(); input.value = s ? s.draft || '' : ''; autosize(); }

  function primaryAction() {
    const s = active(); if (!s) return;
    const run = runOfSession(s); const text = input.value.trim();
    if (run) {
      if (text && !s.queued) { s.queued = text; s.draft = ''; input.value = ''; autosize(); saveDrafts(); renderChat(true); renderComposer(); toast('已排队，本轮结束后自动发送'); }
      else stopRun(run);
      return;
    }
    if (!text) return;
    if (state.gateway !== 'online') { toast('Gateway 未连接，草稿已保留', { tone: 'err' }); return; }
    s.draft = ''; input.value = ''; autosize(); saveDrafts();
    startRun(s, text, pickScenario(text));
  }
  function pickScenario(text) {
    if (/429|重试/.test(text)) return 'retry';
    if (/失败|报错/.test(text)) return 'fail';
    return 'normal';
  }

  // ---------------------------------------------------------------- events log
  function logEvent(run, type, data, kind = 'sse') {
    const id = kind === 'sse' ? (run ? ++run.eventId : 0) : null;
    state.events.push({ seq: ++state.eventSeq, id, type, data: JSON.stringify(data ?? {}), kind, run: run?.id, at: new Date() });
    if (state.events.length > 200) state.events.shift();
  }

  // ---------------------------------------------------------------- run engine
  // Reducer: one place that maps a Gateway SSE frame onto message state.
  function apply(run, type, data) {
    const [s, m] = findMsg(run.msgId); if (!m) return;
    logEvent(run, type, data);
    m.lastEventId = run.eventId;
    const t = now() - m.startedAt;
    const mark = (label, tone = '') => m.timeline.push({ t, label, tone });
    switch (type) {
      case 'run.accepted': m.status = 'pending'; m.phase = 'queued'; mark('run.accepted'); break;
      case 'run.started': m.status = 'running'; m.phase = 'thinking'; mark('run.started', 'accent'); break;
      case 'tool.generating': m.phase = 'tools'; m.generatingTool = data.name; m.toolsOpen = true; mark(`准备调用 ${data.name}`, 'accent'); break;
      case 'tool.started': m.phase = 'tools'; m.generatingTool = null; m.toolsOpen = true; m.tools.push({ call_id: data.call_id, name: data.name, status: 'running', start: now(), duration_s: 0 }); mark(`tool.started ${data.call_id}`, 'accent'); break;
      case 'tool.finished': {
        const tl = m.tools.find((x) => x.call_id === data.call_id);
        if (tl) { tl.status = data.is_error ? 'error' : 'ok'; tl.duration_s = data.duration_s; }
        mark(`tool.finished ${data.call_id} · ${data.duration_s.toFixed(2)}s${data.is_error ? ' · 出错' : ''}`, data.is_error ? 'err' : 'ok');
        if (m.tools.every((x) => x.status !== 'running')) { m.phase = 'thinking'; m.toolsOpen = m.tools.some((x) => x.status === 'error'); }
        break;
      }
      case 'text.delta':

  function startRun(s, userText, scenario) {

  function deltas(text, size = 7, gap = 32) { const out = []; for (let i = 0; i < text.length; i += size) out.push({ d: gap, type: 'text.delta', data: { text: text.slice(i, i + size) } }); return out; }
  const call = () => 'call_' + rid().slice(0, 5);
  function tools(n, errIdx = -1) {
    const ids = Array.from({ length: n }, call);
    const st = [{ d: 380, type: 'tool.generating', data: { name: 'web_search' } }];
    ids.forEach((id, i) => st.push({ d: i ? 60 : 420, type: 'tool.started', data: { call_id: id, name: 'web_search' } }));
    const durs = [0.86, 1.31, 0.97];
    ids.forEach((id, i) => st.push({ d: i ? 420 : 820, type: 'tool.finished', data: { call_id: id, name: 'web_search', duration_s: durs[i], is_error: i === errIdx } }));

  function commit(s, status = 'completed', extra = {}) {

  }
  function buildScript(kind, text, s) {
    const started = { d: 260, type: 'run.started', data: { status: 'running' } };
    switch (kind) {

      }
      case 'toolError': return [started, ...tools(2, 1), { d: 300 }, ...deltas(REPLIES.toolError), ...commit(s)].map(fixWait);
      case 'fail': return [started, ...deltas(REPLIES.fail, 5, 40),
        { d: 400, type: 'retry.scheduled', data: { attempt: 1, max_attempts: 2, wait_s: 1.6, reason: 'http 503' } }, { d: 1600 },
        { d: 600, type: 'retry.scheduled', data: { attempt: 2, max_attempts: 2, wait_s: 0, reason: 'http 503' } },

  function toast(msg, { action, onAction, tone, ms = 4200 } = {}) {
    const el = document.createElement('div'); el.className = 'toast' + (tone === 'err' ? ' err' : '');
    el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
    const kill = () => el.remove();
    if (action) el.querySelector('button').onclick = () => { kill(); onAction?.(); };
    $('toasts').appendChild(el);
    while ($('toasts').children.length > 3) $('toasts').firstChild.remove();
    setTimeout(kill, ms);
    return el;
  }

  // ---------------------------------------------------------------- actions
  function openSession(id) {
    const s = sessionOf(id); if (!s) return;
    const cur = active(); if (cur) cur.draft = input.value;
    state.activeId = id; s.unread = false; state.inspectedMsgId = null; state.renamingHeader = false; state.hasNewBelow = false;
    if (window.matchMedia('(max-width: 860px)').matches) $('app').dataset.sidebar = 'closed';
    syncSidebarBtn(); loadDraft(); renderAll(true);
  }
  function newChat() {
    const empty = state.sessions.find((s) => !s.messages.length && s.title === '新对话');
    if (empty) { openSession(empty.id); input.focus(); return; }
    const id = 'sess_' + rid().slice(0, 4);
    state.sessions.unshift({ id, title: '新对话', group: '今天', revision: 0, metadata_version: 0, active_run_id: null, unread: false, updated: '刚刚', draft: '', queued: null, messages: [] });
    logEvent(null, 'POST /api/sessions', { id }, 'http');
    openSession(id); input.focus();
  }
  function requestDelete(id) {
    const s = sessionOf(id); if (!s || s.active_run_id) return;
    if (state.pendingDelete) commitDelete();
    const timer = setTimeout(commitDelete, 5000);
    state.pendingDelete = { id, timer };
    if (state.activeId === id) { const next = state.sessions.find((x) => x.id !== id); if (next) openSession(next.id); }
    renderSidebar();
    toast(`已删除「${s.title}」`, { action: '撤销', ms: 5000, onAction: () => { clearTimeout(timer); state.pendingDelete = null; renderSidebar(); } });
  }
  function commitDelete() {
    const p = state.pendingDelete; if (!p) return;
    clearTimeout(p.timer); state.pendingDelete = null;
    state.sessions = state.sessions.filter((s) => s.id !== p.id);
    logEvent(null, 'DELETE /api/sessions/' + p.id, { status: 204 }, 'http');
    if (!state.sessions.length) newChat(); else if (!active()) openSession(state.sessions[0].id);
    renderSidebar();
  }
  function toggleTheme() {
    const root = document.documentElement;
    const isDark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = isDark ? 'light' : 'dark'; store.set('theme', root.dataset.theme); renderThemeBtn();
  }
  function renderThemeBtn() {
    const root = document.documentElement;
    const isDark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    $('btn-theme').innerHTML = isDark ? ICON.sun : ICON.moon;
  }
  function setGateway(g) {
    state.gateway = g; renderConn(); renderComposer(); renderInspector();
  }
  function reconnectGateway() {
    setGateway('connecting');
    setTimeout(() => { setGateway('online'); toast('已重新连接 Gateway'); }, 900);
  }
  function syncSidebarBtn() { $('btn-sidebar-open').hidden = $('app').dataset.sidebar === 'open'; }

  // ---------------------------------------------------------------- event wiring
  $('btn-new').onclick = newChat;
  $('btn-palette').onclick = openPalette;
  $('btn-theme').onclick = toggleTheme;
  $('btn-inspector').onclick = () => setInspector(!state.inspectorOpen());
  $('btn-inspector-close').onclick = () => setInspector(false);
  $('btn-sidebar-close').onclick = () => { $('app').dataset.sidebar = 'closed'; syncSidebarBtn(); };
  $('btn-sidebar-open').onclick = () => { $('app').dataset.sidebar = 'open'; if (window.matchMedia('(max-width: 860px)').matches) setInspector(false); syncSidebarBtn(); };
  $('scrim').onclick = () => { $('app').dataset.sidebar = 'closed'; setInspector(false); syncSidebarBtn(); };
  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { state.inspectorTab = t.dataset.tab; renderInspector(); });

  $('conn-chip').addEventListener('click', (e) => { if (e.target.id === 'btn-reconnect') reconnectGateway(); });
  $('title-wrap').addEventListener('click', (e) => { if (e.target.closest('#title-btn')) { state.renamingHeader = true; renderHeader(); } });

  $('session-list').addEventListener('click', (e) => {
    const rn = e.target.closest('[data-rename-start]'); if (rn) { e.stopPropagation(); state.renamingSidebar = rn.dataset.renameStart; renderSidebar(); return; }
    const del = e.target.closest('[data-del]'); if (del) { e.stopPropagation(); requestDelete(del.dataset.del); return; }
    const it = e.target.closest('[data-open]'); if (it) openSession(it.dataset.open);
  });
  $('session-list').addEventListener('keydown', (e) => {
    const it = e.target.closest('[data-open]'); if (!it || e.target !== it) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSession(it.dataset.open); }
    if (e.key === 'F2') { state.renamingSidebar = it.dataset.open; renderSidebar(); }
  });

  $('chat').addEventListener('click', (e) => {
    const s = active();
    const tg = e.target.closest('[data-toggle-tools]');
    if (tg) { const [, m] = findMsg(tg.dataset.toggleTools); if (m && m.tools.length) { m.toolsOpen = !m.toolsOpen; touch(m.id); } return; }
    const ins = e.target.closest('[data-inspect]'); if (ins) { state.inspectedMsgId = ins.dataset.inspect; setInspector(true, 'run'); return; }
    const cc = e.target.closest('[data-copy-code]'); if (cc) { copy(decodeURIComponent(cc.dataset.copyCode), cc); return; }
    const cm = e.target.closest('[data-copy]'); if (cm) { const [, m] = findMsg(cm.dataset.copy); copy(m.text, null); return; }
    const ct = e.target.closest('[data-continue]'); if (ct) { input.value = '接着刚才的内容继续写'; autosize(); input.focus(); renderComposer(); return; }
    const rs = e.target.closest('[data-resend]'); if (rs) {
      const idx = s.messages.findIndex((m) => m.id === rs.dataset.resend);
      const prevUser = [...s.messages.slice(0, idx)].reverse().find((m) => m.role === 'user');
      if (prevUser && !s.active_run_id) startRun(s, prevUser.content, 'normal');
      return;
    }
    const rc = e.target.closest('[data-reconcile]'); if (rc) {
      const [, m] = findMsg(rc.dataset.reconcile);
      logEvent(null, 'GET /api/sessions/' + s.id, { revision: s.revision, active_run_id: null }, 'http');
      rc.disabled = true; rc.textContent = '读取中…';
      setTimeout(() => {
        m.reconciliation = false; m.error = 'shutdown_cancelled';
        m.text = m.text || ''; m.durable = false; touch(m.id);
        toast(`已核对：会话仍是 rev ${s.revision}，这一轮没有保存，可以放心重新发送`, { ms: 5200 });
      }, 700);
      return;
    }
    if (e.target.closest('[data-unqueue]')) { input.value = s.queued; s.queued = null; autosize(); renderChat(false); renderComposer(); input.focus(); return; }
    const st = e.target.closest('[data-starter]'); if (st) {
      if (state.gateway !== 'online') { toast('Gateway 未连接', { tone: 'err' }); return; }
      startRun(s, st.dataset.text, st.dataset.starter);
    }
  });
  function copy(text, btn) {
    const done = () => { if (btn) { btn.textContent = '已复制'; setTimeout(() => (btn.textContent = '复制'), 1400); } else toast('已复制 Markdown'); };
    try { navigator.clipboard.writeText(text).then(done, () => toast('浏览器不允许复制，请手动选中文本', { tone: 'err' })); } catch { toast('浏览器不允许复制，请手动选中文本', { tone: 'err' }); }
  }

  $('insp-body').addEventListener('click', (e) => {
    const sc = e.target.closest('[data-scenario]');
    if (sc) {
      const s = active(); const row = SCENARIOS.find((x) => x[0] === sc.dataset.scenario);
      if (state.gateway !== 'online') { toast('先恢复 Gateway 连接', { tone: 'err' }); return; }
      if (s.active_run_id) { toast('当前会话正在运行，等它结束或先停止', { tone: 'err' }); return; }
      state.inspectorTab = 'run';
      if (window.matchMedia('(max-width: 1180px)').matches) setInspector(false);
      startRun(s, row[3], row[0]); renderInspector();
      return;
    }
    if (e.target.closest('[data-gw-toggle]')) { if (state.gateway === 'online') setGateway('offline'); else reconnectGateway(); }
  });
  $('insp-body').addEventListener('change', (e) => { if (e.target.id === 'hide-deltas') { state.hideDeltas = e.target.checked; renderInspector(); } });

  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('overlay').hidden ? openPalette() : closePalette(); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'o') { e.preventDefault(); newChat(); return; }
    if (mod && e.key === '.') { e.preventDefault(); setInspector(!state.inspectorOpen()); return; }
    if (e.key === 'Escape') {
      if (!$('overlay').hidden) { closePalette(); return; }
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT') return;
      const run = runOfSession(active() || {});
      if (run) { e.preventDefault(); stopRun(run); return; }
      if (state.inspectorOpen() && window.matchMedia('(max-width: 1180px)').matches) setInspector(false);
    }
  });

  // live clocks: elapsed, tool timers, retry countdown
  setInterval(() => {
    document.querySelectorAll('[data-elapsed]').forEach((el) => { const [, m] = findMsg(el.dataset.elapsed); if (m && !isTerminal(m)) el.textContent = fmtS(now() - m.startedAt); });
    document.querySelectorAll('[data-tool-elapsed]').forEach((el) => { el.textContent = fmtS(now() - +el.dataset.start); });
    document.querySelectorAll('[data-retry-left]').forEach((el) => { const [, m] = findMsg(el.dataset.retryLeft); if (m?.retry) el.textContent = Math.max(0, (m.retry.until - now()) / 1000).toFixed(1); });
    document.querySelectorAll('[data-ring]').forEach((el) => { const [, m] = findMsg(el.dataset.ring); if (m?.retry) el.outerHTML = retryRing(m); });
  }, 100);

  function renderAll(scroll) { renderSidebar(); renderConn(); renderHeader(); renderChat(scroll); renderComposer(); renderInspector(); renderThemeBtn(); }

  if (window.matchMedia('(max-width: 860px)').matches) $('app').dataset.sidebar = 'closed';
  syncSidebarBtn(); loadDraft(); renderAll(true);

  // a run already going in another session: shows background progress + unread on finish
  const bg = sessionOf('sess_bg01');
  (function startBackground() {
    const text = bg.messages.pop().content;
    startRun(bg, text, 'long');
  })();
})();
</script>

</html>
